# ZITADEL for CI (spec 006, b): an instance on http://localhost:${ZITADEL_PORT:-18580}, its first instance's machine
# administrator's PAT written to ./state/admin.pat. Not for any other use: a fixed masterkey, no TLS.
name: tresor-zitadel
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.19.4}
    command: start-from-init --masterkey MasterkeyNeedsToHave32Characters --tlsMode disabled
    user: "0"
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-18580}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ci-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: CI administrator
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /state/admin.pat
    ports: ["127.0.0.1:${ZITADEL_PORT:-18580}:8080"]
    volumes: ["./state:/state"]
    depends_on:
      db: {condition: service_healthy}
