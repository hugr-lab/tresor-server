# The Helm chart (spec 003): linted and its manifests checked on every PR; installed on kind - the Kubernetes
# store with the admission policy, PostgreSQL with its password from a Kubernetes Secret, OpenBao with Kubernetes
# auth and the KEK in Transit - through the protocol.
# Pushed from a tag (vX.Y.Z) to oci://ghcr.io/hugr-lab/charts/tresor-server, at the image of the same tag.
name: Chart

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a tag's push runs to its end

permissions:
  contents: read

jobs:
  check:
    name: Chart (lint, kubeconform, kind)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - name: Tools
        run: |
          go install sigs.k8s.io/kind@v0.31.0
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: helm lint
        run: helm lint --strict deploy/helm/tresor-server -f deploy/helm/tresor-server/ci/test-values.yaml
      - name: kubeconform (every state store)
        shell: bash   # -eo pipefail: a render that fails fails the step
        run: |
          for kind in kubernetes postgres sqlserver sqlite memory; do
            schedule='0 3 1 * *'
            [ "$kind" = sqlite ] && schedule=''   # refused there (spec 019)
            helm template t deploy/helm/tresor-server -n tresor -f deploy/helm/tresor-server/ci/test-values.yaml \
              --set config.state.kind=$kind --set tlsSecret=tls --set networkPolicy.enabled=true \
              --set maintenance.refsBeforeUpgrade=true --set maintenance.reseal.schedule="$schedule" \
              --set ingress.enabled=true --set-json 'ingress.hosts=[{"host":"t.example.com"}]' \
              --set-json 'networkPolicy.from=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ingress"}}}]' \
              >"rendered-$kind.yaml"
            kubeconform -strict -summary -kubernetes-version 1.30.0 "rendered-$kind.yaml"
          done
          # a long release name: the maintenance jobs' names cut to fit (spec 019)
          helm template acme-secrets-production-eu-long deploy/helm/tresor-server -n tresor \
            -f deploy/helm/tresor-server/ci/test-values.yaml --set config.state.kind=postgres >rendered-long.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 rendered-long.yaml
          # OpenBao: the projected token for the Vault login (spec 007)
          helm template t deploy/helm/tresor-server -n tresor -f deploy/helm/tresor-server/ci/test-values.yaml \
            --set vaultToken.enabled=true --set-json 'config.vault={"address":"https://bao:8200","auth":{"method":"jwt","role":"r"}}' \
            >rendered-vault.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 rendered-vault.yaml
      - name: kind (the Kubernetes store, PostgreSQL, OpenBao)
        run: scripts/ci/kind.sh

  publish:
    name: Push the chart
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign's keyless signature (spec 022)
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: helm lint
        run: helm lint --strict deploy/helm/tresor-server -f deploy/helm/tresor-server/ci/test-values.yaml
      # the image of the same tag (image.yml) is built beside this: the chart names it before it may exist, so a
      # release is installed once both runs passed
      - name: helm package and push
        shell: bash # -eo pipefail: a failed helm push fails the step, tee or not
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/chart.yml@${{ github.ref }}
        run: |
          version="${TAG#v}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm package deploy/helm/tresor-server --version "$version" --app-version "$TAG" -d out
          helm push "out/tresor-server-$version.tgz" oci://ghcr.io/hugr-lab/charts 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          [ -n "$digest" ] || { echo "no digest from helm push" >&2; exit 1; }
          # the signature, keyless: this workflow's OIDC identity (spec 022); cosign logs in as helm did
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/hugr-lab/charts/tresor-server@$digest"
          cosign verify "ghcr.io/hugr-lab/charts/tresor-server@$digest" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
