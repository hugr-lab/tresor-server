# The container image (spec 002): built on every PR (no push); pushed to ghcr.io/hugr-lab/tresor-server from
# main (:edge, :sha-<short>) and from a tag (:vX.Y.Z). linux/amd64 and linux/arm64 - Go cross-compiles, the final
# stage only copies, so no emulation is needed. Spec 022: scanned (Trivy) on every run; a pushed image carries an
# SBOM and provenance (BuildKit's attestations) and is signed keylessly (cosign: this workflow's OIDC identity).
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # a PR: built, never pushed - and no token that could push
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=pr-${{ github.event.number }}
          cache-from: type=gha
      # the scan: the amd64 image, loaded locally - a HIGH or CRITICAL finding with a fix fails the PR
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tresor-server:scan
          build-args: VERSION=pr-${{ github.event.number }}
          cache-from: type=gha
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tresor-server:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  push:
    name: Build and push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign's keyless signature: this workflow's identity, no key
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hugr-lab/tresor-server
          flavor: latest=false # :edge and :vX.Y.Z only (spec 002)
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.tags != '' }} # a manual run elsewhere than main or a tag: built only
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the signature: of the pushed digest (the index of both platforms), by this workflow's OIDC identity
      - name: Sign
        if: steps.meta.outputs.tags != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/hugr-lab/tresor-server@$DIGEST"
      - name: Verify the signature
        if: steps.meta.outputs.tags != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}
        run: |
          cosign verify "ghcr.io/hugr-lab/tresor-server@$DIGEST" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Trivy
        if: steps.meta.outputs.tags != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/hugr-lab/tresor-server@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
