# CI (specs 002, 003): the Go tests on every PR, and tresor's conformance suite against this service. tresor is
# built once per pinned commit (scripts/ci/tresor_checkout.sh) and cached: its build is C++ (DuckDB).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tresor-test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Tresor-Test-2026!
        ports: ['51433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Tresor-Test-2026!' -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 40
      # spec 007: OpenBao and HashiCorp Vault, dev servers
      openbao:
        image: openbao/openbao:2.4.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports: ['18200:8200']
      hashicorp-vault:
        image: hashicorp/vault:2.1.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
        ports: ['18201:8200']
    env:
      TRESOR_TEST_POSTGRES: postgres://postgres@127.0.0.1:55432/postgres?sslmode=disable
      TRESOR_TEST_POSTGRES_PASSWORD: tresor-test
      TRESOR_TEST_SQLSERVER: sqlserver://sa@127.0.0.1:51433?encrypt=disable
      TRESOR_TEST_SQLSERVER_PASSWORD: Tresor-Test-2026!
      TRESOR_TEST_VAULT: http://127.0.0.1:18200,http://127.0.0.1:18201
      TRESOR_TEST_VAULT_TOKEN: root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: envtest (kube-apiserver and etcd, for the Kubernetes store)
        run: |
          assets="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1 use 1.37.0 -p path)"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: go test
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ZITADEL in docker (spec 006): the service as its issuer's client with key_file, a token minted by exchange
  zitadel:
    name: ZITADEL (token exchange, key_file)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: ZITADEL, live
        run: scripts/ci/zitadel.sh

  # the Container Apps recipe compiles, lint included
  bicep:
    name: Bicep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: az bicep build
        run: |
          az bicep install
          az bicep build -f deploy/azure-container-apps/main.bicep --stdout >/dev/null 2>bicep.log || { cat bicep.log; exit 1; }
          if grep -q Warning bicep.log; then cat bicep.log; exit 1; fi

  # tresor at the pinned commit, built on a cache miss only (a new pin): its own workflow, so a change here
  # does not rebuild it
  tresor:
    name: tresor build (pinned)
    uses: ./.github/workflows/tresor-build.yml

  conformance:
    name: Conformance (${{ matrix.state }}, ${{ matrix.replicas }})
    needs: tresor
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {state: memory, replicas: 1}
          - {state: sqlite, replicas: 1}
          - {state: postgres, replicas: 2}   # two replicas behind a round-robin proxy
          - {state: sqlserver, replicas: 2}
          - {state: kubernetes, replicas: 2}  # envtest's API server, no cluster
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tresor-test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Tresor-Test-2026!
        ports: ['51433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Tresor-Test-2026!' -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      TRESOR_TEST_POSTGRES: postgres://postgres@127.0.0.1:55432/postgres?sslmode=disable
      TRESOR_TEST_POSTGRES_PASSWORD: tresor-test
      TRESOR_TEST_SQLSERVER: sqlserver://sa@127.0.0.1:51433?encrypt=disable
      TRESOR_TEST_SQLSERVER_PASSWORD: Tresor-Test-2026!
      TRESOR_CONFORMANCE_REPLICAS: ${{ matrix.replicas }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: envtest (kube-apiserver and etcd, for the Kubernetes store)
        if: matrix.state == 'kubernetes'
        run: |
          assets="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1 use 1.37.0 -p path)"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Check out tresor (the tests, no submodules)
        run: scripts/ci/tresor_checkout.sh _tresor
      - uses: actions/download-artifact@v8
        with:
          name: tresor-build
      - name: Unpack tresor's build
        run: |
          tar -xzf tresor-build.tar.gz -C _tresor
          _tresor/build/release/test/unittest --help >/dev/null   # it loads: its libraries came along
      - name: tresor's conformance suite and reference-server tests
        run: |
          set -o pipefail   # a failing script must fail the step, whatever the summary line says
          scripts/ci/conformance.sh _tresor "${{ matrix.state }}" 2>&1 | tee conformance.log
          _tresor/scripts/ci/assert_ran.sh conformance.log 5 66 'require-env TRESOR_CONFORMANCE'
          grep -q "the reference server's tests passed" conformance.log
          grep -q "private_key_jwt: a node logged in to Keycloak with its key" conformance.log
