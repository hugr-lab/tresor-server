# The docs site on GitHub Pages (https://hugr-lab.github.io/tresor-server/), from main. docs-build.yml is the
# pull requests' gate; this one never runs on a pull request, so it never cancels a deploy in flight.
# A second build of the same docs goes to hugr-lab.com/docs/tresor-server/ (IONOS) when the organisation's
# DOCS_IONOS is true - until then those steps are skipped.
# Versions (spec 035): each release tag's docs are snapshotted at build time (scripts/ci/docs_versions.sh) - the
# latest release at the root, main's docs as "Next" under /next/; a main push changes /next/, a tag the root.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "scripts/ci/docs_versions.sh"
    # a release tag is a new docs version (the tag's push runs this: a release made with GITHUB_TOKEN would not)
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags are the docs' released versions
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: npm ci && docusaurus build
        working-directory: website
        env:
          # while the hugr-lab.com copy exists, this copy names it as canonical (and has no sitemap)
          DOCS_CANONICAL: ${{ vars.DOCS_IONOS == 'true' && 'https://hugr-lab.com/docs/tresor-server/' || '' }}
        run: |
          npm ci
          git fetch --tags --force
          ../scripts/ci/docs_versions.sh
          npx docusaurus build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - name: Build for hugr-lab.com
        if: ${{ vars.DOCS_IONOS == 'true' }}
        working-directory: website
        env:
          DOCS_TARGET: ionos
        run: npm run build -- --out-dir build-ionos

      # the copy that is uploaded is checked too: what a PR's build saw may differ (a release's versions, say)
      - name: Check the hugr-lab.com copy requests no other server
        if: ${{ vars.DOCS_IONOS == 'true' }}
        working-directory: website
        run: |
          found=$(grep -rhoE "(src=\"|srcset=\"|url\(|@import )['\"]?https?://[^\"') ]+" build-ionos | sort -u || true)
          if [ -n "$found" ]; then echo "third-party requests in the hugr-lab.com build:"; echo "$found"; exit 1; fi

      - name: Upload to hugr-lab.com (IONOS)
        if: ${{ vars.DOCS_IONOS == 'true' }}
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE: ${{ vars.IONOS_DOCS_ROOT || '/hugr-lab/docs' }}/tresor-server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Mirrors the build into docs/tresor-server/ on IONOS; nothing outside that folder is touched.
          lftp --env-password -u "$USER" -e "set sftp:auto-confirm yes; set net:max-retries 3; \
            mirror --reverse --delete --verbose website/build-ionos/ $REMOTE; bye" \
            "sftp://$HOST"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
