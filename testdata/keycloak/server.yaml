# tresor-server next to the Keycloak of tresor's server/docker-compose.yml, for tresor's conformance suite
# (scripts/ci/conformance.sh, through tresor's scripts/ci/test_keycloak.sh). It matches tresor's own
# server/testdata/keycloak/server.yaml, which the tests are written against; test_keycloak.sh rewrites the
# two ports. scripts/ci/conformance.sh sets the state kind.
listen: 127.0.0.1:18443
public_url: http://127.0.0.1:18443
state:
  kind: memory
issuers:
  - issuer: http://127.0.0.1:18480/realms/tresor
    audience: duckdb-secrets
    client_id: duckdb
    scopes: [openid]
    human_flows: [authorization_code, device_code]
    service_flows: [client_credentials, private_key_jwt]
    roles_claim: realm_access.roles
    # a client-credentials token carries Keycloak's client_id session note (the service_account scope)
    service: {claim: client_id}
    # the service's own client at Keycloak: it mints token_exchange secrets for callers (tresor specs/010)
    exchange: {client_id: duckdb-secrets, client_secret_env: TRESOR_EXCHANGE_SECRET}
policy:
  # only admins manage secrets and grant their use, to roles and groups (tresor specs/009); the etl service
  # is one, for the conformance suite
  admins: [role:secrets_admin, client:etl]
  actors:                                    # servers that may act for users (tresor specs/007, 009)
    - {principal: client:acl-node, verbs: [use, create, update, delete, annotate, grant]}   # admins manage through it
