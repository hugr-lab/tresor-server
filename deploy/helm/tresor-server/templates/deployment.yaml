{{- include "tresor.validate" . }}
{{- $kind := include "tresor.stateKind" . }}
{{- $scheme := ternary "HTTPS" "HTTP" (ne .Values.tlsSecret "") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tresor.fullname" . }}
  labels: {{- include "tresor.labels" . | nindent 4 }}
spec:
  replicas: {{ include "tresor.replicas" . }}
  {{- if has $kind (list "sqlite" "memory") }}
  strategy: {type: Recreate}   # one replica: the old pod lets go first
  {{- end }}
  selector:
    matchLabels: {{- include "tresor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tresor.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include "tresor.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      {{- include "tresor.podSecurity" . | trim | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: tresor-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [-config, /etc/tresor/server.yaml]
          ports:
            - {name: http, containerPort: 8080}
          {{- with include "tresor.env" . | trim }}{{ . | nindent 10 }}{{ end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # the endpoints drop the pod before it stops serving (the image has no shell: the kubelet sleeps)
            preStop: {sleep: {seconds: 5}}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- include "tresor.volumeMounts" . | trim | nindent 10 }}
      {{- include "tresor.volumes" . | trim | nindent 6 }}
      {{- with include "tresor.scheduling" . | trim }}{{ . | nindent 6 }}{{ end }}
