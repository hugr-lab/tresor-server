{{- if and .Values.pdb.enabled (gt (int (include "tresor.replicas" .)) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tresor.fullname" . }}
  labels: {{- include "tresor.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "tresor.selectorLabels" . | nindent 6 }}
{{- end }}
