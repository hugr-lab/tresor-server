{{- if .Values.networkPolicy.enabled }}
# Only the peers named reach the service's port (the ingress controller, with tls.offload); the kubelet's
# probes are not subject to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tresor.fullname" . }}
  labels: {{- include "tresor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tresor.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: {{- required "networkPolicy.from names the peers that may reach the service" .Values.networkPolicy.from | toYaml | nindent 8 }}
      ports: [{port: 8080}]
{{- end }}
