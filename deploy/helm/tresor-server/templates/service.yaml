apiVersion: v1
kind: Service
metadata:
  name: {{ include "tresor.fullname" . }}
  labels: {{- include "tresor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "tresor.selectorLabels" . | nindent 4 }}
  ports:
    - {name: {{ ternary "https" "http" (ne .Values.tlsSecret "") }}, port: {{ .Values.service.port }}, targetPort: http}
