# tresor-server (spec 003). An upgrade that changes it: kubectl apply --server-side -f crds/ first.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tresoractors.tresor.hugr-lab.io
  labels:
    app.kubernetes.io/name: tresor-server
spec:
  group: tresor.hugr-lab.io
  scope: Namespaced
  names:
    kind: TresorActor
    listKind: TresorActorList
    plural: tresoractors
    singular: tresoractor
    categories:
    - tresor
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: 'An actor''s grant counter: the per-actor limit''s compare-and-set. Written by tresor-server only (spec 003): a hand edit makes it unreadable.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - actorOwner
            - counter
            - dataKeyID
            - mac
            properties:
              actorOwner:
                type: string
              counter:
                type: integer
                format: int64
              dataKeyID:
                type: string
              mac:
                type: string
                format: byte
