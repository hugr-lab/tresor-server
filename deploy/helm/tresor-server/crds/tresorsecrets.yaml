# tresor-server (spec 003). An upgrade that changes it: kubectl apply --server-side -f crds/ first.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tresorsecrets.tresor.hugr-lab.io
  labels:
    app.kubernetes.io/name: tresor-server
spec:
  group: tresor.hugr-lab.io
  scope: Namespaced
  names:
    kind: TresorSecret
    listKind: TresorSecretList
    plural: tresorsecrets
    singular: tresorsecret
    categories:
    - tresor
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: 'A secret: its descriptor, grants and sealed params. Written by tresor-server only (spec 003): a hand edit makes it unreadable.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - name
            - rowID
            - type
            - provider
            - comment
            - owner
            - version
            - createdAt
            - updatedAt
            - dataKeyID
            - sealed
            - mac
            properties:
              name:
                type: string
              rowID:
                type: string
              type:
                type: string
              provider:
                type: string
              scope:
                type: array
                items:
                  type: string
                nullable: true
              redactKeys:
                type: array
                items:
                  type: string
                nullable: true
              comment:
                type: string
              owner:
                type: string
              version:
                type: integer
                format: int64
              createdAt:
                type: integer
                format: int64
              updatedAt:
                type: integer
                format: int64
              grants:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - principal
                  - verbs
                  properties:
                    id:
                      type: string
                    principal:
                      type: string
                    verbs:
                      type: array
                      items:
                        type: string
                      nullable: true
                nullable: true
              dataKeyID:
                type: string
              sealed:
                type: string
                format: byte
              mac:
                type: string
                format: byte
