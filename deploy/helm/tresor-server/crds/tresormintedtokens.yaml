# tresor-server (spec 003). An upgrade that changes it: kubectl apply --server-side -f crds/ first.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tresormintedtokens.tresor.hugr-lab.io
  labels:
    app.kubernetes.io/name: tresor-server
spec:
  group: tresor.hugr-lab.io
  scope: Namespaced
  names:
    kind: TresorMintedToken
    listKind: TresorMintedTokenList
    plural: tresormintedtokens
    singular: tresormintedtoken
    categories:
    - tresor
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: 'A delegation grant''s minted token for one audience and scope, sealed. Written by tresor-server only (spec 003): a hand edit makes it unreadable.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - idHash
            - key
            - version
            - failed
            - dataKeyID
            - mac
            properties:
              idHash:
                type: string
                format: byte
              key:
                type: string
                format: byte
              version:
                type: integer
                format: int64
              failed:
                type: string
              dataKeyID:
                type: string
              sealed:
                type: string
                format: byte
                nullable: true
              mac:
                type: string
                format: byte
