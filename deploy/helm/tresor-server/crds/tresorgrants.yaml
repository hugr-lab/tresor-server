# tresor-server (spec 003). An upgrade that changes it: kubectl apply --server-side -f crds/ first.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tresorgrants.tresor.hugr-lab.io
  labels:
    app.kubernetes.io/name: tresor-server
spec:
  group: tresor.hugr-lab.io
  scope: Namespaced
  names:
    kind: TresorGrant
    listKind: TresorGrantList
    plural: tresorgrants
    singular: tresorgrant
    categories:
    - tresor
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: 'A delegation grant: the actor, the user, the sealed subject token. Its id is never stored. Written by tresor-server only (spec 003): a hand edit makes it unreadable.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - idHash
            - actorOwner
            - actorClient
            - actorIssuer
            - userOwner
            - user
            - expiresAt
            - subjectExpiresAt
            - dataKeyID
            - mac
            properties:
              idHash:
                type: string
                format: byte
              actorOwner:
                type: string
              actorClient:
                type: string
              actorIssuer:
                type: string
              userOwner:
                type: string
              user:
                type: string
              expiresAt:
                type: integer
                format: int64
              subjectExpiresAt:
                type: integer
                format: int64
              dataKeyID:
                type: string
              subjectSealed:
                type: string
                format: byte
                nullable: true
              mac:
                type: string
                format: byte
