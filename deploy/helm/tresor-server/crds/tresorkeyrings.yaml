# tresor-server (spec 003). An upgrade that changes it: kubectl apply --server-side -f crds/ first.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tresorkeyrings.tresor.hugr-lab.io
  labels:
    app.kubernetes.io/name: tresor-server
spec:
  group: tresor.hugr-lab.io
  scope: Namespaced
  names:
    kind: TresorKeyring
    listKind: TresorKeyringList
    plural: tresorkeyrings
    singular: tresorkeyring
    categories:
    - tresor
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: 'The active data key (one, named active); the installation''s mark (one, named installation). Written by tresor-server only (spec 003): a hand edit makes it unreadable.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - dataKeyID
            - slot
            properties:
              dataKeyID:
                type: string
              slot:
                type: integer
                format: int64
              instance:
                type: string
              mac:
                type: string
                format: byte
                nullable: true
