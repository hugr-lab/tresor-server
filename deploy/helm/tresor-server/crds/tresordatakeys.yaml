# tresor-server (spec 003). An upgrade that changes it: kubectl apply --server-side -f crds/ first.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tresordatakeys.tresor.hugr-lab.io
  labels:
    app.kubernetes.io/name: tresor-server
spec:
  group: tresor.hugr-lab.io
  scope: Namespaced
  names:
    kind: TresorDataKey
    listKind: TresorDataKeyList
    plural: tresordatakeys
    singular: tresordatakey
    categories:
    - tresor
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: 'A data key, wrapped by the KEK and tagged under its root. Written by tresor-server only (spec 003): a hand edit makes it unreadable.'
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - id
            - kekID
            - wrapped
            - createdAt
            properties:
              id:
                type: string
              kekID:
                type: string
              wrapped:
                type: string
                format: byte
              tag:
                type: string
                format: byte
                nullable: true
              createdAt:
                type: integer
                format: int64
